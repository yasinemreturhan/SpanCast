<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>UniversalShare</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background:#0f1117; color:#e6e6e6; margin:0;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .panel { text-align:center; }
  h1 { color:#4f8cff; font-size:48px; margin-bottom:8px; }
  p { color:#9aa3b2; }
  input { font-size:28px; padding:14px 20px; width:420px; border-radius:14px;
          border:2px solid #2a3040; background:#1b1f2a; color:#fff; text-align:center; }
  input:focus { border-color:#4f8cff; outline:none; }
  button { font-size:26px; padding:14px 48px; margin-top:20px; border-radius:14px; border:2px solid transparent;
           background:#4f8cff; color:#fff; cursor:pointer; }
  button:focus { border-color:#fff; outline:none; }
  #status { min-height:28px; margin-top:16px; }
  iframe { position:fixed; inset:0; width:100vw; height:100vh; border:0; display:none; background:#000; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <h1>UniversalShare</h1>
    <p>Ekran gönderen cihazdaki UniversalShare sunucusuna bağlan</p>
    <input id="addr" placeholder="örn. 192.168.1.20:8788">
    <br>
    <button id="go">Bağlan</button>
    <p id="status"></p>
  </div>
  <iframe id="view" allow="autoplay; encrypted-media"></iframe>

<script>
// webOS TV tarayıcı motoru Chromium tabanlı — WebRTC alıcı doğrudan çalışır.
// Not: self-signed sertifika iframe'de sessizce reddedilebilir; bu durumda
// uygulama window.location ile tam sayfa geçer (TV, sertifika uyarısını gösterir).
var addr = document.getElementById('addr');
var status = document.getElementById('status');
try { addr.value = localStorage.getItem('server') || ''; } catch (e) {}

function connect() {
  var host = addr.value.trim();
  if (!host) { status.textContent = 'Adres gerekli'; return; }
  try { localStorage.setItem('server', host); } catch (e) {}
  status.textContent = 'Bağlanılıyor…';
  // Tam sayfa yönlendirme: sertifika onayı ve tam ekran video için en sağlam yol.
  window.location.href = 'https://' + host + '/receiver.html';
}

document.getElementById('go').addEventListener('click', connect);
addr.addEventListener('keydown', function (e) { if (e.key === 'Enter') connect(); });

// TV kumandası: ok tuşlarıyla input↔buton arası odak geçişi webOS'ta yerleşiktir;
// sayfa açılınca inputa odaklan.
addr.focus();
</script>
</body>
</html>
