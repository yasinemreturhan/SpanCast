<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniversalShare — Ekran Al</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background:#000; color:#e6e6e6; margin:0;
         min-height:100vh; }

  /* Eşleşme paneli: akış yokken ortada büyük; akış varken köşede küçük. */
  #pairUi { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            text-align:center; z-index:10; transition:all .3s; }
  body.streaming #pairUi { inset:auto 16px 16px auto; transform:scale(.55);
                           transform-origin:bottom right; background:#0f1117cc;
                           border:1px solid #2a3040; border-radius:16px; padding:16px; }
  #pinBox { font-size:64px; letter-spacing:16px; font-weight:700; color:#4f8cff; }
  #qr { display:none; width:160px; height:160px; border-radius:8px; margin-top:12px;
        background:#fff; padding:6px; }
  #status { color:#9aa3b2; min-height:20px; }

  /* Multi-share grid */
  #grid { position:fixed; inset:0; display:grid; gap:2px; }
  .tile { position:relative; background:#0a0c10; overflow:hidden; }
  .tile video { width:100%; height:100%; object-fit:contain; }
  .tile .label { position:absolute; left:10px; top:8px; font-size:13px; padding:2px 10px;
                 background:#0f1117cc; border-radius:10px; }
  .tile .stat { position:absolute; right:10px; top:8px; font:11px monospace; color:#6f7a8a; }
</style>
</head>
<body>
  <div id="grid"></div>
  <div id="pairUi">
    <div>
      <h2>🖥️ Ekran Al</h2>
      <div id="pinBox">······</div>
      <div><img id="qr" alt="Eşleşme QR kodu"></div>
      <p>Gönderen cihazda bu kodu gir ya da QR'ı okut.</p>
      <p id="status">Sunucuya bağlanılıyor…</p>
    </div>
  </div>
  <script type="module" src="js/receiver.js"></script>
</body>
</html>
