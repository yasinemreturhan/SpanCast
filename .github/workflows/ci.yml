name: CI

on:
  push:
    branches: [ main, v2-flutter ]
  pull_request:
    branches: [ main, v2-flutter ]

jobs:
  flutter-android:
    name: Flutter Analyze, Test & Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Analyze
        run: |
          cd app
          flutter analyze

      - name: Run unit & integration tests
        run: |
          cd app
          flutter test

      - name: Build Android APK
        run: |
          cd app
          flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doscreen-android-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  flutter-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Windows Desktop Release
        run: |
          cd app
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Compress Windows bundle
        run: |
          cd app
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\DoScreen-Windows-x64.zip

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: doscreen-windows-zip
          path: app/build/DoScreen-Windows-x64.zip

  flutter-macos:
    name: Build macOS Desktop Release (.app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd app
          flutter config --no-enable-swift-package-manager
          flutter config --enable-macos-desktop
          flutter pub get
          cd macos
          pod install --repo-update

      - name: Build macOS Desktop Release
        run: |
          cd app
          flutter build macos --release

      - name: Compress macOS bundle
        run: |
          cd app/build/macos/Build/Products/Release
          zip -r ../../../../../DoScreen-macOS.zip *.app

      - name: Upload macOS bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: doscreen-macos-zip
          path: DoScreen-macOS.zip

