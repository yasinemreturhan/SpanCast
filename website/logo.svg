<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Outer Glow Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Primary Screen Gradient -->
    <linearGradient id="screen1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Secondary (Extended) Screen Gradient -->
    <linearGradient id="screen2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Beam & "S" Dynamic Wave Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle ambient inner light -->
  <circle cx="256" cy="240" r="160" fill="#06b6d4" opacity="0.08" filter="url(#strongGlow)"/>

  <!-- BACK SCREEN (Extended Display / TV / Screen 2) -->
  <g transform="translate(190, 96)">
    <!-- Shadow -->
    <rect x="0" y="8" width="220" height="150" rx="18" fill="#000000" opacity="0.45" filter="url(#glow)"/>
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="220" height="150" rx="18" fill="#131b2e" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
    <!-- Glass Inner Screen -->
    <rect x="10" y="10" width="200" height="110" rx="10" fill="url(#screen2Grad)"/>
    <!-- Screen Header Dots -->
    <circle cx="24" cy="22" r="3.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="36" cy="22" r="3.5" fill="#38bdf8" opacity="0.4"/>
    <circle cx="48" cy="22" r="3.5" fill="#38bdf8" opacity="0.2"/>
    <!-- Wireless Wave Indicator on Top Screen -->
    <path d="M 170 24 A 12 12 0 0 1 186 24" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 164 18 A 20 20 0 0 1 192 18" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Display Stand / Base -->
    <path d="M 94 150 L 88 174 L 132 174 L 126 150 Z" fill="#1e293b" opacity="0.8"/>
    <rect x="70" y="174" width="80" height="7" rx="3.5" fill="#334155"/>
  </g>

  <!-- FRONT SCREEN (Laptop / Phone / Screen 1) -->
  <g transform="translate(100, 210)">
    <!-- Shadow -->
    <rect x="0" y="12" width="230" height="158" rx="20" fill="#000000" opacity="0.55" filter="url(#glow)"/>
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="230" height="158" rx="20" fill="url(#screen1Grad)" stroke="#00f2fe" stroke-width="3" stroke-opacity="0.85"/>
    <!-- Glass Inner Screen -->
    <rect x="12" y="12" width="206" height="116" rx="12" fill="#090d16"/>
    <!-- Screen Stand / Laptop Base -->
    <path d="M 98 158 L 92 186 L 138 186 L 132 158 Z" fill="#1e293b"/>
    <rect x="72" y="186" width="86" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- THE SPANCAST BEAM: Energetic "S" Shape Interconnecting Displays -->
  <!-- Back Glow of the Beam -->
  <path d="M 145 315 C 210 315, 230 255, 275 240 C 330 220, 365 200, 365 145" 
        fill="none" stroke="#00f2fe" stroke-width="18" stroke-linecap="round" opacity="0.3" filter="url(#strongGlow)"/>

  <!-- Core Dynamic Beam Line (Forms a futuristic 'S' curve) -->
  <path d="M 145 315 C 215 315, 230 255, 275 240 C 330 220, 365 195, 365 145" 
        fill="none" stroke="url(#beamGrad)" stroke-width="9" stroke-linecap="round"/>

  <!-- Forward Casting Pulse Node (Origin) -->
  <circle cx="145" cy="315" r="9" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="145" cy="315" r="4.5" fill="#ffffff"/>

  <!-- Forward Casting Pulse Node (Target Display Entry) -->
  <circle cx="365" cy="145" r="10" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="365" cy="145" r="5" fill="#ffffff"/>

  <!-- Center Bridge Spark (The crossover point) -->
  <circle cx="265" cy="242" r="6" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="265" cy="242" r="2.5" fill="#ffffff"/>

  <!-- Radiating Cast Ripple Rays -->
  <g opacity="0.85">
    <path d="M 388 130 C 402 140, 402 150, 388 160" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 402 120 C 422 135, 422 155, 402 170" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
